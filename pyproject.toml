[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grypton-hunter"
version = "3.0.1"
description = "Autonomous scoped security testing with a GLM worker, Spark manager, and independent Astra validation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = []
authors = [{name = "Pacman / SecYour"}]
dependencies = []

[project.scripts]
grypton = "grypton.cli:main"
kraude = "grypton.cli:worker_main"
kryptex = "grypton.cli:manager_main"
grypton-mcp = "grypton.toolserver:mcp_main"
grypton-tool = "grypton.toolserver:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grypton", "grypton.*"]

[tool.setuptools.package-data]
grypton = ["resources/*.json", "resources/prompts/*", "resources/skills/*.md", "resources/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
