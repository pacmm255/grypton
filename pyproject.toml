[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grypton-review"
version = "2.0.0"
description = "A three-model workspace for reviewing supplied security evidence and remediation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = []
authors = [{name = "Pacman / SecYour"}]
dependencies = []

[project.scripts]
grypton = "grypton.cli:main"
kraude = "grypton.cli:worker_main"
kryptex = "grypton.cli:manager_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grypton", "grypton.*"]

[tool.setuptools.package-data]
grypton = ["resources/*.json", "resources/prompts/*.md", "resources/skills/*.md", "resources/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
